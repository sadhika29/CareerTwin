<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" fill="none">
  <defs>
    <!-- Soft Drop Shadow -->
    <filter id="shadow1" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#4C2365" flood-opacity="0.18" />
    </filter>
    <filter id="badgeShadow1" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#3B1B50" flood-opacity="0.25" />
    </filter>
    
    <!-- Purple Gradients -->
    <linearGradient id="purpleGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A65D5" />
      <stop offset="100%" stop-color="#6B2896" />
    </linearGradient>
    <linearGradient id="badgeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8338EC" />
      <stop offset="100%" stop-color="#541388" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F4EFFB" />
    </linearGradient>
  </defs>

  <!-- ID Card Base -->
  <rect x="7" y="11" width="48" height="42" rx="9" fill="url(#cardGrad1)" filter="url(#shadow1)" stroke="#EDE5F8" stroke-width="1.2" />

  <!-- Avatar Icon Inside Card -->
  <!-- Head -->
  <circle cx="23" cy="25" r="7" fill="url(#purpleGrad1)" />
  <!-- Body/Shoulders -->
  <path d="M12 44 C12 36.5 17 34 23 34 C29 34 34 36.5 34 44 Z" fill="url(#purpleGrad1)" />

  <!-- Info lines on the right of ID card -->
  <rect x="34" y="22" width="15" height="3.5" rx="1.75" fill="#C4A4DA" />
  <rect x="34" y="28.5" width="15" height="3.5" rx="1.75" fill="#C4A4DA" />
  <rect x="34" y="35" width="10" height="3.5" rx="1.75" fill="#C4A4DA" />

  <!-- Pencil Circular Badge Overlapping Bottom Right -->
  <g filter="url(#badgeShadow1)">
    <circle cx="49" cy="46" r="14" fill="url(#badgeGrad1)" stroke="#FFFFFF" stroke-width="1.8" />
    <!-- White Pencil Icon angled at 45 deg -->
    <g transform="translate(49, 46) rotate(45) translate(-49, -46)">
      <!-- Pencil Body -->
      <path d="M46.8 41.5 L51.2 41.5 L51.2 48.5 L49 51.5 L46.8 48.5 Z" fill="#FFFFFF" />
      <!-- Pencil Tip Lead -->
      <polygon points="48,50 50,50 49,51.5" fill="#541388" />
      <!-- Eraser line -->
      <line x1="46.8" y1="43.5" x2="51.2" y2="43.5" stroke="#8338EC" stroke-width="0.8" />
    </g>
  </g>
</svg>
