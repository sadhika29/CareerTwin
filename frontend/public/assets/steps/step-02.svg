<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" fill="none">
  <defs>
    <!-- Soft Shadows -->
    <filter id="shadow2" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#4C2365" flood-opacity="0.18" />
    </filter>
    <filter id="chartShadow2" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#3B1B50" flood-opacity="0.22" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="robotWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EDE9FE" />
    </linearGradient>
    <linearGradient id="robotScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#381452" />
      <stop offset="100%" stop-color="#4C2365" />
    </linearGradient>
    <linearGradient id="purpleGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A65D5" />
      <stop offset="100%" stop-color="#6B2896" />
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8338EC" />
      <stop offset="100%" stop-color="#541388" />
    </linearGradient>
  </defs>

  <!-- Sparkles in Top Right -->
  <!-- Top diamond star -->
  <path d="M54 11 Q54 16 49 16 Q54 16 54 21 Q54 16 59 16 Q54 16 54 11 Z" fill="#8B5CF6" />
  <!-- Bottom small diamond star -->
  <path d="M62 21 Q62 24.5 58.5 24.5 Q62 24.5 62 28 Q62 24.5 65.5 24.5 Q62 24.5 62 21 Z" fill="#A78BFA" />

  <!-- Robot Group -->
  <g filter="url(#shadow2)">
    <!-- Antenna -->
    <rect x="27.5" y="11" width="3" height="7" rx="1.5" fill="#7C3AED" />
    <circle cx="29" cy="10" r="3.5" fill="url(#purpleGrad2)" />

    <!-- Ear bumps -->
    <rect x="9.5" y="27" width="5.5" height="12" rx="2.75" fill="url(#purpleGrad2)" />
    <rect x="42.5" y="27" width="5.5" height="12" rx="2.75" fill="url(#purpleGrad2)" />

    <!-- Lower Body / Neck base -->
    <rect x="16" y="38" width="26" height="12" rx="6" fill="url(#robotWhite)" stroke="#E4DCFA" stroke-width="1" />

    <!-- Head -->
    <rect x="12" y="17" width="34" height="26" rx="13" fill="url(#robotWhite)" stroke="#E4DCFA" stroke-width="1.2" />

    <!-- Screen Visor -->
    <rect x="16.5" y="21.5" width="25" height="16.5" rx="8" fill="url(#robotScreen)" />

    <!-- Happy Eyes (curved arcs) -->
    <path d="M21 30.5 C22.2 27.5 24.8 27.5 26 30.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <path d="M32 30.5 C33.2 27.5 35.8 27.5 37 30.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Mini Analytics Chart Badge Overlapping Bottom Right -->
  <g filter="url(#chartShadow2)">
    <rect x="35" y="33" width="27" height="25" rx="7" fill="#FFFFFF" stroke="#EDE5F8" stroke-width="1.2" />
    
    <!-- 3 Ascending Vertical Bars -->
    <!-- Bar 1 (Shortest) -->
    <rect x="40" y="44" width="4" height="8" rx="2" fill="#C4A4DA" />
    <!-- Bar 2 (Medium) -->
    <rect x="46.5" y="39" width="4" height="13" rx="2" fill="url(#purpleGrad2)" />
    <!-- Bar 3 (Tallest) -->
    <rect x="53" y="36" width="4" height="16" rx="2" fill="url(#barGrad3)" />
  </g>
</svg>
